<!DOCTYPE html>
<html>
<head>
    <title>Responsive Gallery Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        /* Header */
        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Gallery Section */
        .gallery-container {
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .caption {
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        /* Media Queries */

        /* Tablet */
        @media (max-width: 992px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }

        /* Footer */
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

    </style>
</head>

<body>

<header>
    <h1>My Responsive Image Gallery</h1>
</header>

<section class="gallery-container">
    <div class="gallery">

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1015/600/400" alt="Nature 1">
            <div class="caption">Beautiful Mountains</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1016/600/400" alt="Nature 2">
            <div class="caption">Green Forest</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1018/600/400" alt="Nature 3">
            <div class="caption">Ocean View</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1020/600/400" alt="Nature 4">
            <div class="caption">Desert Landscape</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1024/600/400" alt="Nature 5">
            <div class="caption">Cute Dog</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1027/600/400" alt="Nature 6">
            <div class="caption">Sunset View</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1036/600/400" alt="Nature 7">
            <div class="caption">City Skyline</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1043/600/400" alt="Nature 8">
            <div class="caption">Snow Mountains</div>
        </div>

    </div>
</section>

<footer>
    <p>© 2026 Responsive Gallery | Designed by Student</p>
</footer>

</body>
</html>
